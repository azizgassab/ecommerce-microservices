version: '3.9'

services:

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    ports:
      - "2181:2181"
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "2181"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  user-service:
    build: ./services/user-service
    container_name: user-service
    ports:
      - "4001:4001"
      - "50051:50051"
    volumes:
      - ./services/user-service:/app
      - /app/node_modules
      - ./proto:/proto
    env_file:
      - ./services/user-service/.env
    environment:
      GRPC_PORT: 50051
    depends_on:
      kafka:
        condition: service_healthy

  product-service:
    build: ./services/product-service
    container_name: product-service
    ports:
      - "3001:3001"
      - "50052:50052"
    volumes:
      - ./services/product-service:/app
      - /app/node_modules
      - ./proto:/proto
    env_file:
      - ./services/product-service/.env
    environment:
      GRPC_PORT: 50052
    depends_on:
      kafka:
        condition: service_healthy

  order-service:
    build: ./services/order-service
    container_name: order-service
    ports:
      - "3002:3002"
      - "50053:50053"
    volumes:
      - ./services/order-service:/app
      - /app/node_modules
      - ./proto:/proto
    env_file:
      - ./services/order-service/.env
    environment:
      GRPC_PORT: 50053
    depends_on:
      kafka:
        condition: service_healthy

  notification-service:
    build: ./services/notification-service
    container_name: notification-service
    ports:
      - "3003:3003"
    volumes:
      - ./services/notification-service:/app
      - /app/node_modules
    env_file:
      - ./services/notification-service/.env
    depends_on:
      kafka:
        condition: service_healthy

  api-gateway:
    build: ./api-gateway
    container_name: api-gateway
    ports:
      - "4000:4000"
    volumes:
      - ./api-gateway:/app
      - /app/node_modules
      - ./proto:/proto
    env_file:
      - ./api-gateway/.env
    environment:
      PORT: 3000
      USER_GRPC_HOST: user-service:50051
      PRODUCT_GRPC_HOST: product-service:50052
      ORDER_GRPC_HOST: order-service:50053
    depends_on:
      - user-service
      - product-service
      - order-service

  frontend:
    build: ./frontend
    container_name: frontend
    ports:
      - "3004:3000"
    environment:
      REACT_APP_GATEWAY_REST_URL: http://localhost:3000/api
      REACT_APP_GATEWAY_GRAPHQL_URL: http://localhost:3000/graphql
      REACT_APP_PRODUCTS_SERVICE_URL: http://localhost:3001
      REACT_APP_ORDERS_SERVICE_URL: http://localhost:3002
    depends_on:
      - api-gateway
      - product-service
      - order-service
